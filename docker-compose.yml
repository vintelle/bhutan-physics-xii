services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: physics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-physics}
      POSTGRES_DB: physics_xii
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physics -d physics_xii"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://physics:${POSTGRES_PASSWORD:-physics}@db:5432/physics_xii?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (32+ chars)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TEACHER_SIGNUP_CODE: ${TEACHER_SIGNUP_CODE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
volumes:
  pgdata:
